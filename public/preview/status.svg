<svg xmlns="http://www.w3.org/2000/svg" width="495" height="100" viewBox="0 0 495 100" role="img" aria-labelledby="cardTitle">
  <title id="cardTitle">Available for work - Backend, platform and dev tooling</title>
  <rect x="1" y="1" width="493" height="98" fill="#ffffff" stroke="#000000" stroke-width="2" shape-rendering="crispEdges" />
<style>
    text { font-family: 'SF Mono', 'Cascadia Code', 'Courier New', Consolas, monospace; }
    .title { font-size: 13px; font-weight: 700; fill: #000000; letter-spacing: 0.5px; }
    .title-inverse { font-size: 13px; font-weight: 700; fill: #ffffff; letter-spacing: 0.5px; }
    .body { font-size: 12px; font-weight: 400; fill: #000000; }
    .dim { font-size: 11px; font-weight: 400; fill: #666666; }
    .heading { font-size: 11px; font-weight: 700; fill: #666666; letter-spacing: 1px; }
    .value { font-size: 12px; font-weight: 700; fill: #000000; }
    .glyph { font-size: 12px; font-weight: 700; fill: #000000; }
    
    @keyframes reveal { from { opacity: 0; } to { opacity: 1; } }
    @keyframes fill { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    .reveal { animation: reveal 0.01s steps(1, end) backwards; }
    .meter { animation: fill 0.8s steps(12, end) backwards; transform-origin: left center; }
    .blink { animation: blink 1.2s steps(1, end) infinite; }
    @media (prefers-reduced-motion: reduce) {
      .reveal, .meter, .blink { animation: none; }
    }
  </style>
  <g class="reveal">
    <rect x="2" y="2" width="491" height="22" fill="#000000" shape-rendering="crispEdges" />
    <text class="title-inverse" x="10" y="13" dominant-baseline="central">STATUS</text>
  </g>
  <g>
    <rect class="blink" x="16" y="45" width="9" height="9" fill="#000000" shape-rendering="crispEdges" />
    <text class="title reveal" style="animation-delay: 0.06s" x="33" y="54" dominant-baseline="alphabetic">Available for work</text>
    <line class="reveal" style="animation-delay: 0.12s" x1="16" y1="66.5" x2="479" y2="66.5" stroke="#595959" stroke-width="1" stroke-dasharray="2,2" shape-rendering="crispEdges" />
    <text class="body reveal" style="animation-delay: 0.18s" x="16" y="86">Backend, platform and dev tooling</text>
  </g>
</svg>