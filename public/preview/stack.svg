      <text class="body" font-size="11" x="177" y="126.5" dominant-baseline="central" text-anchor="middle">Svelte</text>
    </g>
    <line class="reveal" style="animation-delay: 0.42s" x1="16" y1="144.5" x2="479" y2="144.5" stroke="#595959" stroke-width="1" stroke-dasharray="2,2" shape-rendering="crispEdges" />
    <text class="heading reveal" style="animation-delay: 0.21s" x="16" y="160">TOOLS</text>
