      <text class="body" font-size="11" x="113" y="182.5" dominant-baseline="central" text-anchor="middle">Terraform</text>
    </g>
    <g class="reveal" style="animation-delay: 0.27s">
      <rect x="156" y="172" width="61" height="20" fill="none" stroke="#000000" stroke-width="1" shape-rendering="crispEdges" />
      <text class="body" font-size="11" x="186.5" y="182.5" dominant-baseline="central" text-anchor="middle">Actions</text>
