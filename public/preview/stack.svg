      <text class="body" font-size="11" x="163" y="70.5" dominant-baseline="central" text-anchor="middle">Python</text>
    </g>
    <g class="reveal" style="animation-delay: 0.09s">
      <rect x="196" y="60" width="34" height="20" fill="none" stroke="#000000" stroke-width="1" shape-rendering="crispEdges" />
      <text class="body" font-size="11" x="213" y="70.5" dominant-baseline="central" text-anchor="middle">SQL</text>
    </g>
    <line class="reveal" style="animation-delay: 0.24s" x1="16" y1="88.5" x2="479" y2="88.5" stroke="#595959" stroke-width="1" stroke-dasharray="2,2" shape-rendering="crispEdges" />
    <text class="heading reveal" style="animation-delay: 0.12s" x="16" y="104">FRAMEWORKS</text>
    <g class="reveal" style="animation-delay: 0.12s">
